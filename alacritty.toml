# Configuration for Alacritty, the GPU enhanced terminal emulator.

[general]
import = [
    "~/git/dotfiles/theme/generated/alacritty.toml",
]
live_config_reload = true

[window]
dynamic_padding = false
startup_mode = "Fullscreen"

[font]
size = 12.0

[font.normal]
family = "MesloLGS Nerd Font"
style = "Regular"

[font.bold]
family = "MesloLGS Nerd Font"
style = "Regular"

[font.italic]
family = "MesloLGS Nerd Font"
style = "Light"

[font.bold_italic]
family = "MesloLGS Nerd Font"
style = "Light"

[colors]
draw_bold_text_with_bright_colors = false

[selection]
save_to_clipboard = true

[cursor.style]
blinking = "On"

[[keyboard.bindings]]
key = "6"
mods = "Control"
chars = "\u001e"
